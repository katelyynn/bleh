name: Mirror

on:
  push:
  workflow_dispatch:
  delete:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeberg:
    name: Codeberg
    if: github.repository == 'katelyynn/bleh'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: wearerequired/git-mirror-action@6bbc55f2f0082bca533b72dc711f7d37154d40cc
        env:
          SSH_PRIVATE_KEY: ${{ secrets.CODEBURG_SSH_PRIVATE_KEY }}
        with:
          source-repo: "git@github.com:katelyynn/bleh.git"
          destination-repo: "git@codeberg.org:aihara/bleh.git"
